<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10a8d2" />
    <meta
      name="description"
      content="Mela mela — something cheerful is gathering over Malta. Stay tuned."
    />
    <meta property="og:title" content="Mela Mela" />
    <meta
      property="og:description"
      content="Something cheerful is gathering over Malta. Stay tuned."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/melamela-background.png" />
    <title>mela mela · stay tuned</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="scene" aria-labelledby="site-title">
      <div class="layer layer--sky" aria-hidden="true"></div>
      <div class="layer layer--backdrop" aria-hidden="true"></div>

      <div class="layer layer--clouds layer--clouds-far" aria-hidden="true">
        <img src="/assets/clay-clouds.webp" alt="" />
      </div>
      <div class="layer layer--clouds layer--clouds-near" aria-hidden="true">
        <img src="/assets/clay-clouds.webp" alt="" />
      </div>

      <div class="sun-glow" aria-hidden="true"></div>

      <section class="copy">
        <p class="eyebrow">FROM A SUNNY LITTLE ISLAND</p>
        <h1 id="site-title">
          <span>Mela.</span>
          <span>Mela!</span>
        </h1>
        <p class="domain">melamela.cloud</p>
        <p class="status"><span aria-hidden="true"></span> Stay tuned</p>
        <a class="contact" href="mailto:paul@melamela.cloud">paul@melamela.cloud</a>
      </section>

      <div class="layer layer--characters" aria-hidden="true">
        <img src="/assets/clay-characters.webp" alt="" />
      </div>

      <div class="foreground-shadow" aria-hidden="true"></div>

      <button class="motion-toggle" type="button" aria-pressed="false">
        <span class="motion-toggle__icon" aria-hidden="true">Ⅱ</span>
        <span class="motion-toggle__label">Pause motion</span>
      </button>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
